<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HuurRadar</title>
<meta name="theme-color" content="#0f1720">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23ff6b35'/><path d='M9 17l7-6 7 6v7H9z' fill='white'/></svg>">
<style>
  :root{
    --bg:#f4f1ec; --card:#fff; --ink:#16181d; --muted:#6b6f78; --line:#e4dfd6;
    --accent:#ff6b35; --accent-ink:#fff; --new:#1f9d55; --off:#a3a3a3;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1720; --card:#17212c; --ink:#eef1f4; --muted:#93a0ad; --line:#26323f; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 10px}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto}
  h1{margin:0;font-size:22px;letter-spacing:-.02em}
  h1 span{color:var(--accent)}
  .meta{color:var(--muted);font-size:13px;text-align:right}
  .filters{display:flex;flex-wrap:wrap;gap:8px;max-width:1100px;margin:10px auto 0}
  .filters input,.filters select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
  .filters input[type=search]{flex:1 1 180px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;user-select:none;font-size:14px}
  .chip input{margin:0;accent-color:var(--accent)}
  .price{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
  .price input{width:110px;accent-color:var(--accent);padding:0;border:0}
  .tabs{display:flex;gap:6px;overflow-x:auto;max-width:1100px;margin:12px auto 0;padding-bottom:2px;scrollbar-width:thin}
  .tab{flex:none;font:inherit;font-size:14px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap;position:relative}
  .tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .tab .n{font-weight:700;margin-left:6px}
  .tab.unread::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
  .like{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:transform .1s}
  .like:active{transform:scale(.88)}
  .like svg{width:20px;height:20px;fill:none;stroke:#16181d;stroke-width:2}
  .like.on svg{fill:#e5484d;stroke:#e5484d}
  .tab.fav .n{color:#e5484d}
  .tab.fav.on .n{color:#ff8a8d}
  .badge.seg{background:#6d4ad8}
  .proj .status{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--line);color:var(--ink);width:max-content}
  .proj .status.live{background:#1f9d55;color:#fff}
  .proj .status.soon{background:#e8a317;color:#16181d}
  .proj .status.plan{background:#3b82f6;color:#fff}
  .proj .txt{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .proj .more{margin-top:auto;padding-top:8px;font-weight:600;color:var(--accent);font-size:14px}
  main{max-width:1100px;margin:0 auto;padding:16px}
  .summary{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:14px}
  .summary button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .12s, box-shadow .12s}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .card.off{opacity:.5}
  .img{aspect-ratio:16/10;background:var(--line);position:relative;overflow:hidden}
  .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .img .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
  .img .ph svg{width:44px;height:44px;opacity:.35}
  .badges{position:absolute;top:8px;left:8px;display:flex;gap:6px}
  .badge{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.65);color:#fff}
  .badge.new{background:var(--new)}
  .badge.off{background:var(--off)}
  .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
  .p{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .t{font-weight:600}
  .a{color:var(--muted);font-size:13px}
  .facts{display:flex;gap:12px;margin-top:auto;padding-top:8px;font-size:13px;color:var(--muted)}
  .facts b{color:var(--ink);font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:60px 10px}
  .status{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;flex-wrap:wrap}
  .dot{font-size:12px;color:var(--muted)}
  .dot::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:var(--new)}
  .dot.bad::before{background:#d64545}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Huur<span>Radar</span></h1>
    <div class="meta"><div id="updated">Laden…</div><div class="status" id="status"></div></div>
  </div>
  <div class="filters">
    <input type="search" id="q" placeholder="Zoek straat, wijk…">
    <select id="area"><option value="">Alle gebieden</option></select>
    <select id="source"><option value="">Alle sites</option></select>
    <label class="price">Max €<output id="maxOut"></output><input type="range" id="max" min="500" max="3000" step="50"></label>
    <select id="sort">
      <option value="new">Nieuwste eerst</option>
      <option value="price">Goedkoopste eerst</option>
      <option value="m2">Grootste eerst</option>
    </select>
    <label class="chip"><input type="checkbox" id="showOff"> Ook offline</label>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <div class="summary"><span id="count"></span><button id="markRead">Alle scans gezien</button></div>
  <div class="grid" id="grid"></div>
</main>

<script>
const SOURCES = {pararius:"Pararius", huurwoningen:"Huurwoningen.nl", funda:"Funda", vesteda:"Vesteda", woonstad:"Woonstad", vbt:"vb&t", huispedia:"Huispedia", mijndak:"WoningNet MH", handmatig:"Eigen lijst"};
let projects = [];
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
let data = null;
let tab = "all";                       // "all" of de tijd van een scan
let seen = new Set(JSON.parse(store.get("hr_seen_scans") || "[]"));
const saveSeen = () => store.set("hr_seen_scans", JSON.stringify([...seen]));
// geliked: id -> momentopname van de woning (blijft zichtbaar als hij offline gaat)
let likes = JSON.parse(store.get("hr_likes") || "{}");
const saveLikes = () => store.set("hr_likes", JSON.stringify(likes));
const HEART = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.5 7.8 3.6 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.5 3.3 4.3 6.6-1.8 4.8-9.3 9.4-9.3 9.4z"/></svg>';
function likedList(){
  const cur = Object.fromEntries(data.listings.map(l => [l.id, l]));
  return Object.entries(likes).map(([id, snap]) => cur[id] || {...snap, active:false});
}

const euro = n => n == null ? "Prijs onbekend" : "€ " + n.toLocaleString("nl-NL");
const ago = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "zojuist";
  if (m < 60) return m + " min geleden";
  const h = Math.round(m / 60);
  if (h < 24) return h + " uur geleden";
  return Math.round(h / 24) + " dag(en) geleden";
};
const scanLabel = iso => new Date(iso).toLocaleString("nl-NL",
  {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function scans(){
  // nieuwste eerst; oudere data zonder scan-lijst: afleiden uit first_seen
  let list = data.scans && data.scans.length ? data.scans.slice()
    : [...new Set(data.listings.map(l => l.first_seen))].map(t => ({time:t}));
  list.forEach(s => s.new = data.listings.filter(l => l.first_seen === s.time).length);
  return list.sort((a,b) => b.time.localeCompare(a.time));
}

async function load(){
  try{
    const r = await fetch("listings.json?t=" + Date.now(), {cache:"no-store"});
    data = await r.json();
  }catch(e){
    data = {listings:[]};
  }
  try{
    const r2 = await fetch("nieuwbouw.json?t=" + Date.now(), {cache:"no-store"});
    projects = (await r2.json()).projecten || [];
  }catch(e){ projects = []; }
  $("updated").textContent = data.updated ? "Laatste scan " + ago(data.updated) : "Nog geen scan gedraaid";
  // eerste bezoek: alle bestaande scans behalve de nieuwste als gezien markeren
  if (!store.get("hr_seen_scans")) { scans().slice(1).forEach(s => seen.add(s.time)); saveSeen(); }
  init();
  render();
}

let inited = false;
function init(){
  $("status").innerHTML = Object.entries(data.status || {}).map(([s,v]) =>
    `<span class="dot ${v.ok ? "" : "bad"}" title="${v.ok ? "werkt" : "geblokkeerd of fout bij laatste scan"}">${SOURCES[s]||s}</span>`).join("");
  if (inited) return;
  inited = true;
  const areas = [...new Set(data.listings.map(l => l.area).concat(projects.map(p => p.area)).filter(Boolean))].sort();
  areas.forEach(a => $("area").add(new Option(a, a)));
  Object.entries(SOURCES).forEach(([k,v]) => $("source").add(new Option(v, k)));
  const max = data.criteria?.max_prijs || 1500;
  $("max").max = Math.max(3000, max); $("max").value = max; $("maxOut").textContent = max;
  ["q","area","source","max","sort","showOff"].forEach(id =>
    $(id).addEventListener("input", () => { $("maxOut").textContent = $("max").value; render(); }));
  $("markRead").onclick = () => { scans().forEach(s => seen.add(s.time)); saveSeen(); render(); };
  $("tabs").addEventListener("click", e => {
    const b = e.target.closest(".tab"); if (!b) return;
    tab = b.dataset.t;
    if (tab !== "all" && tab !== "liked" && tab !== "nieuwbouw") { seen.add(tab); saveSeen(); }
    render();
  });
  $("grid").addEventListener("click", e => {
    const b = e.target.closest(".like"); if (!b) return;
    e.preventDefault(); e.stopPropagation();
    const id = b.dataset.id;
    if (likes[id]) delete likes[id];
    else { const l = data.listings.find(x => x.id === id); if (l) likes[id] = {...l, liked_at:new Date().toISOString()}; }
    saveLikes(); render();
  });
  // open meteen de nieuwste ongelezen scan
  const firstUnread = scans().find(s => !seen.has(s.time) && s.new);
  if (firstUnread) { tab = firstUnread.time; seen.add(tab); saveSeen(); }
}

function renderTabs(){
  const all = `<button class="tab ${tab==="all"?"on":""}" data-t="all">Alle woningen<span class="n">${data.listings.filter(l=>l.active!==false).length}</span></button>`
    + `<button class="tab fav ${tab==="liked"?"on":""}" data-t="liked">♥ Geliked<span class="n">${Object.keys(likes).length}</span></button>`
    + `<button class="tab ${tab==="nieuwbouw"?"on":""}" data-t="nieuwbouw">🏗 Nieuwbouw<span class="n">${projects.length}</span></button>`;
  $("tabs").innerHTML = all + scans().map(s =>
    `<button class="tab ${tab===s.time?"on":""} ${seen.has(s.time)?"":"unread"}" data-t="${s.time}">${scanLabel(s.time)}<span class="n">${s.new ? "+" + s.new : "0"}</span></button>`).join("");
}

function render(){
  renderTabs();
  if (tab === "nieuwbouw") return renderProjects();
  const q = $("q").value.toLowerCase().trim();
  const max = +$("max").value;
  const inLiked = tab === "liked";
  const inScan = tab !== "all" && !inLiked;
  let list = (inLiked ? likedList() : data.listings).filter(l =>
    (inLiked || (inScan ? l.first_seen === tab : ($("showOff").checked || l.active !== false))) &&
    (!$("area").value || l.area === $("area").value) &&
    (!$("source").value || l.source === $("source").value) &&
    (l.price == null || l.price <= max) &&
    (!q || `${l.title} ${l.address} ${l.wijk||""} ${l.area}`.toLowerCase().includes(q))
  );
  const s = $("sort").value;
  list.sort((a,b) => s === "price" ? (a.price??1e9) - (b.price??1e9)
                  : s === "m2" ? (b.surface??0) - (a.surface??0)
                  : b.first_seen.localeCompare(a.first_seen));
  const unread = scans().filter(s => !seen.has(s.time) && s.new);
  const nUnread = unread.reduce((n,s) => n + s.new, 0);
  $("count").textContent = inLiked
    ? `${list.length} gelikete woning${list.length===1?"":"en"}`
    : inScan
    ? `${list.length} nieuwe woning${list.length===1?"":"en"} in scan van ${scanLabel(tab)}`
    : `${list.length} woning${list.length===1?"":"en"}` + (nUnread ? ` · ${nUnread} nieuw in ${unread.length} ongelezen scan${unread.length===1?"":"s"}` : "");
  document.title = nUnread ? `(${nUnread}) HuurRadar` : "HuurRadar";
  $("grid").innerHTML = list.length ? list.map(card).join("") :
    `<div class="empty">${inLiked ? "Nog niks geliked. Tik op het hartje bij een woning om hem hier te bewaren." : inScan ? "Deze scan vond geen nieuwe woningen." : "Geen woningen gevonden met deze filters."}</div>`;
}

function statusClass(st){
  st = (st||"").toLowerCase();
  if (st.includes("binnenkort")) return "soon";
  if (st.includes("verhuur") || st.includes("beschikbaar")) return "live";
  if (st.includes("plan") || st.includes("aanbouw") || st.includes("bouw")) return "plan";
  return "";
}
function renderProjects(){
  const q = $("q").value.toLowerCase().trim();
  const order = {soon:0, live:1, plan:2, "":3};
  let list = projects.filter(p =>
    (!$("area").value || p.area === $("area").value) &&
    (!q || `${p.name} ${p.wijk||""} ${p.city||""} ${p.text||""}`.toLowerCase().includes(q)));
  list.sort((a,b) => order[statusClass(a.status)] - order[statusClass(b.status)] || (a.area||"").localeCompare(b.area||""));
  $("count").textContent = `${list.length} nieuwbouwproject${list.length===1?"":"en"} in je gebieden`;
  const firstEver = projects.reduce((m,p) => p.first_seen < m ? p.first_seen : m, "9999");
  $("grid").innerHTML = list.length ? list.map(p => {
    const fresh = p.first_seen > firstEver && (Date.now() - new Date(p.first_seen)) < 4*864e5 && p.source !== "handmatig";
    return `<a class="card proj" href="${esc(p.url||"#")}" target="_blank" rel="noopener">
      <div class="img">
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg></div>
        ${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
        <div class="badges">${fresh?'<span class="badge new">Nieuw</span>':""}<span class="badge">${SOURCES[p.source]||p.source}</span></div>
      </div>
      <div class="body">
        <span class="status ${statusClass(p.status)}">${esc(p.status||"Status onbekend")}</span>
        <div class="t">${esc(p.name)}</div>
        <div class="a">${esc([p.wijk, p.city].filter(Boolean).join(" · "))}${p.segment ? " · " + esc(p.segment) : ""}</div>
        ${p.price ? `<div class="a"><b>${esc(p.price)}</b> p/m</div>` : ""}
        ${p.text ? `<div class="txt">${esc(p.text)}</div>` : ""}
        <div class="more">Bekijk project →</div>
      </div></a>`;
  }).join("") : `<div class="empty">Nog geen nieuwbouwprojecten gevonden in je gebieden.</div>`;
}

function card(l){
  const isNew = !seen.has(l.first_seen) && l.active !== false && tab !== "liked" && tab === "all";
  const off = l.active === false;
  return `<a class="card ${off?"off":""}" href="${esc(l.url)}" target="_blank" rel="noopener">
    <div class="img">
      <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></div>
      ${l.image ? `<img src="${esc(l.image)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      <div class="badges">${isNew?'<span class="badge new">Nieuw</span>':""}${off?'<span class="badge off">Offline</span>':""}<span class="badge">${SOURCES[l.source]||l.source}</span>${l.segment && l.segment !== "vrije sector" ? `<span class="badge seg">${l.segment === "sociaal" ? "Sociale huur" : esc(l.segment)}</span>` : ""}</div>
      <button class="like ${likes[l.id]?"on":""}" data-id="${esc(l.id)}" aria-label="${likes[l.id]?"Niet meer liken":"Liken"}">${HEART}</button>
    </div>
    <div class="body">
      <div class="p">${euro(l.price)}<span class="a"> /mnd</span></div>
      <div class="t">${esc(l.title)}</div>
      <div class="a">${esc(l.address)}</div>
      <div class="facts">
        ${l.surface ? `<span><b>${l.surface}</b> m²</span>` : ""}
        ${l.rooms ? `<span><b>${l.rooms}</b> kamers</span>` : ""}
        <span>${esc(l.area||"")}</span>
        <span style="margin-left:auto">${ago(l.first_seen)}</span>
      </div>
    </div>
  </a>`;
}

load();
setInterval(load, 10 * 60 * 1000); // elke 10 minuten verversen
</script>
</body>
</html>
