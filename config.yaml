# ============================================================
#  HuurRadar – zoekinstellingen
#  Pas dit bestand aan op GitHub (potloodje) en sla op.
#  De volgende scan (08:17 of 18:17) gebruikt de nieuwe instellingen.
# ============================================================

max_prijs: 1500        # maximale huur per maand in euro's
min_prijs: 0
min_kamers: 0          # 0 = geen minimum
min_oppervlakte: 0     # in m², 0 = geen minimum

# Advertenties met een van deze woorden (in titel, tekst, link of foto) worden overgeslagen
uitsluiten_woorden:
  - woningruil
  - ruilwoning
  - woning ruilen
  - ruilen met

# Welke sites doorzocht worden (true/false)
bronnen:
  pararius: true
  huurwoningen: true
  funda: true          # Funda blokkeert bots vaak; mislukt dit, dan gaan de andere gewoon door
  vesteda: true        # grote verhuurder, ook nieuwbouwprojecten
  woonstad: true       # Woonstad Rotterdam vrije sector + nieuwbouwprojecten
  vbt: true            # vb&t Verhuurmakelaars (o.a. Bouwinvest)
  huispedia: true
  mijndak: true        # WoningNet regio Midden-Holland (sociale huur, Gouda e.o.)
  verra: true          # Verra Makelaars (Rotterdam, Gouda e.o.)
  vastgoednl: true     # Vastgoed Nederland / VBO-makelaars
  househunting: true
  kamernet: true
  ikwilhuren: true     # MVGM (ikwilhuren.nu)

# Deze sites blokkeren de servers van GitHub. Ze worden alleen opgehaald door de scan op je eigen Mac
# (zie lokaal/README.md). GitHub slaat ze over.
lokaal_bronnen: [pararius, huurwoningen, funda]

# Kamers (gedeelde woningen) van Kamernet meenemen?
kamers: false
# ikwilhuren.nu heeft geen plaatsfilter: zoveel pagina's (10 woningen p/p, nieuwste eerst) per scan
ikwilhuren_paginas: 8

# Gebieden. Per plaats:
#   slug      = plaatsnaam zoals in de URL van de sites
#   postcodes = (optioneel) alleen woningen met deze postcodes. Bereik "3031-3039" of los "3059".
#               Zonder postcodes wordt de hele plaats meegenomen.
#   wijken    = (optioneel) woorden waarop gematcht wordt als een advertentie geen postcode toont
gebieden:
  - naam: Rotterdam
    slug: rotterdam
    postcodes:
      - "3031-3039"   # Rotterdam Noord (Oude Noorden, Blijdorp, Liskwartier, Agniesebuurt, Bergpolder, Provenierswijk)
      - "3059"        # Nesselande
      - "3061-3063"   # Kralingen
      - "3064-3069"   # Prins Alexander (Ommoord, Zevenkamp, Het Lage Land, Oosterflank, Prinsenland)
    wijken:
      - noord
      - blijdorp
      - liskwartier
      - oude noorden
      - agniesebuurt
      - bergpolder
      - provenierswijk
      - kralingen
      - nesselande
      - prins alexander
      - ommoord
      - zevenkamp
      - lage land
      - oosterflank
      - prinsenland
  - naam: Nieuwerkerk aan den IJssel
    slug: nieuwerkerk-aan-den-ijssel
    postcodes: ["2911-2914"]
  - naam: Zevenhuizen
    slug: zevenhuizen
    postcodes: ["2761-2762"]
  - naam: Gouda
    slug: gouda
    postcodes: ["2800-2809"]
  - naam: Zoetermeer
    slug: zoetermeer
    postcodes: ["2711-2729"]

# Hoeveel resultaatpagina's per site per plaats maximaal (nieuwste staan bovenaan)
max_paginas: 3

# Per scan max zoveel nieuwe woningen openen voor foto + woningruil-check
max_detailpaginas: 15

# Advertenties die niet meer online staan worden na zoveel dagen uit het overzicht gehaald
bewaar_dagen_offline: 14

# Hoeveel scans als los tabblad in het overzicht blijven staan
bewaar_scans: 30

# ---------------- Nieuwbouw-tabblad ----------------
# Extra woorden waarmee een project als "in jouw gebied" herkend wordt (naast de wijken hierboven)
nieuwbouw_extra_trefwoorden:
  rotterdam: [gerdesiaweg, van de leckestraat, marinus van der stoepstraat, kralinger esch, de esch, toepad,
              "'s-gravenland", ringvaartplas, ommoord, zevenkamp, oosterflank, crooswijk]
# Kaartvakken [zuid, west, noord, oost] voor woningen/projecten zonder postcode (Rotterdam)
nieuwbouw_kaartvakken:
  rotterdam:
    - [51.925, 4.455, 51.950, 4.495]   # Rotterdam Noord
    - [51.912, 4.495, 51.940, 4.545]   # Kralingen
    - [51.940, 4.520, 51.990, 4.620]   # Prins Alexander, Ommoord, Zevenkamp, Nesselande
