name: Pagina's ophalen (ontwikkeltool)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL's, gescheiden door spaties"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi playwright && python -m playwright install --with-deps chromium
      - run: python tools/fetch_pages.py "${{ inputs.urls }}"
      - name: Op aparte branch zetten
        run: |
          cd out; gzip -9 *.html *.calls.json 2>/dev/null || true
          git init -q -b "devpages-${{ github.run_id }}"
          git config user.name "huurradar-bot"; git config user.email "huurradar-bot@users.noreply.github.com"
          git add -A && git commit -qm "pages"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "devpages-${{ github.run_id }}"
