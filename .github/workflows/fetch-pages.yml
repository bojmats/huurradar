name: Pagina's ophalen (ontwikkeltool)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL's, gescheiden door spaties"
        required: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - run: python tools/fetch_pages.py "${{ inputs.urls }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pages
          path: out/
          retention-days: 3
