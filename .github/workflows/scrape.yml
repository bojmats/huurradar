name: Huurwoningen checken

on:
  schedule:
    - cron: "17 7,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scraper/scrape.py --modus cloud
      - name: Resultaat opslaan
        run: |
          git config user.name "huurradar-bot"
          git config user.email "huurradar-bot@users.noreply.github.com"
          git add docs/listings.json docs/nieuwbouw.json
          git diff --cached --quiet || git commit -m "Update huurwoningen $(date -u +%H:%M)"
          git pull --rebase
          git push
